services:
  # Api Services
  pm-api-dev:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile.dev
    container_name: pm-api-dev
    restart: unless-stopped
    ports:
      - "8017:8017"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env.dev
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_OPTIONS=--max-old-space-size=512
    depends_on:
      pm-db-dev:
        condition: service_healthy
      pm-redis-dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - pm-network-dev

  # Database
  pm-db-dev:
    image: postgres:18-alpine
    container_name: pm-db-dev
    restart: always
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
    ports:
      - "5432:5432"
    command: -c max_connections=50
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - pm-network-dev
    volumes:
      - pm-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  pm-redis-dev:
    image: redis:alpine
    container_name: pm-redis-dev
    ports:
      - "6379:6379"
    env_file:
      - .env.dev
    environment:
      - REDIS_USER=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - pm-network-dev
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "--user",
          "${REDIS_USER}",
          "-a",
          "${REDIS_PASSWORD}",
          "--no-auth-warning",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # RabbitMQ
  pm-rabbitmq-dev:
    image: rabbitmq:3-management-alpine
    container_name: pm-rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - pm-network-dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Opensearch
  opensearch-dashboards-dev:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: opensearch-dashboards-dev
    ports:
      - "5601:5601"   
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch-node-dev:9200"]
      - OPENSEARCH_USERNAME=${OPENSEARCH_USERNAME}
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    networks:
      - pm-network-dev
    depends_on:
      - opensearch-node-dev

  opensearch-node-dev:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch-node-dev
    environment:
      - cluster.name=log-cluster
      - node.name=opensearch-node-dev
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      # Kredensial Administrator Utama (Username default: admin)
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_NODE_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"   # Port forwarding untuk REST API / Ingestion
      - "9600:9600"   # Port forwarding untuk Performance Analyzer
    volumes:
      - opensearch-data-dev:/usr/share/opensearch/data
    networks:
      - pm-network-dev

volumes:
  pm-db-data-dev:
  opensearch-data-dev:

networks:
  pm-network-dev:
    name: pm-network-dev
    external: true
