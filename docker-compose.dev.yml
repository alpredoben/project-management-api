services:
  pm-api-dev:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile.dev
    container_name: pm-api-dev
    restart: unless-stopped
    ports:
      - "8017:8017"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env.dev
    environment:
      - CHOKIDAR_USEPOLLING=false
      - NODE_OPTIONS=--max-old-space-size=512
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - pm-network-dev

networks:
  pm-network-dev:
    name: pm-network-dev
    external: true
